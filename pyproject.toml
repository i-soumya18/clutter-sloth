[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clutter-sloth"
version = "0.1.0"
description = "A slow, careful, local-only Downloads folder sorter powered by open-weight vision models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Soumyaranjan Sahoo" }
]
keywords = [
    "file-organizer",
    "local-ai",
    "unsloth",
    "vision-models",
    "open-weight",
    "automation",
    "hacktoberfest",
    "sloth"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = [
    "watchdog>=4.0",
    "pillow>=10.0",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "requests>=2.31",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "reportlab>=4.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
sloth = "sloth.cli:main"

[tool.setuptools.packages.find]
include = ["sloth*"]

[tool.ruff]
line-length = 100
target-version = "py311"
